<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Flat AI Bulk Creator + 9Router Connector banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="0.6" stop-color="#0e1730"/>
      <stop offset="1" stop-color="#161033"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bcd0ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <g opacity="0.14" stroke="#7aa2ff" stroke-width="1">
    <path d="M0 250 L1280 70" /><path d="M0 290 L1280 110"/><path d="M0 210 L1280 30"/>
  </g>
  <g fill="none" stroke="#2a3a63" stroke-width="2" opacity="0.7">
    <circle cx="1112" cy="160" r="96" stroke-dasharray="5 12"/>
    <circle cx="1112" cy="160" r="64"/>
  </g>
  <g filter="url(#glow)">
    <path d="M1140 84 L1064 200 H1108 L1094 280 L1170 164 H1126 Z" fill="url(#flame)"/>
  </g>

  <text x="72" y="140" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="800" fill="url(#txt)">Flat AI Bulk Creator</text>
  <text x="72" y="196" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="600" fill="#9fb4e6">+ 9Router Connector</text>
  <text x="74" y="246" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="19" fill="#6f86bb">headless account ops · auto cookies &amp; tokens · OpenAI-compatible bridge</text>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="16">
    <rect x="72" y="266" width="150" height="30" rx="15" fill="#12203f" stroke="#2a4470"/>
    <text x="92" y="286" fill="#8fb4ff">zero browser</text>
    <rect x="234" y="266" width="150" height="30" rx="15" fill="#12203f" stroke="#2a4470"/>
    <text x="254" y="286" fill="#8fb4ff">no email verify</text>
    <rect x="396" y="266" width="196" height="30" rx="15" fill="#12203f" stroke="#2a4470"/>
    <text x="416" y="286" fill="#8fb4ff">9Router ready</text>
  </g>
